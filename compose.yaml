services:
  backend:
    build:
      context: ./protected-app
    container_name: sentinelvault-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-sentinelgate}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sentinelvault-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  database:
    image: mysql:8.4
    container_name: sentinelvault-database
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - database-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  database-data:

networks:
  backend-network:
    driver: bridge
