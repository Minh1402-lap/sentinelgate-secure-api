openapi: 3.1.0
info:
  title: SentinelGate / SentinelVault API
  version: 1.0.0
  description: Security-focused authentication, profile, administration, and health API.
  license:
    name: ISC
    identifier: ISC
servers:
  - url: http://127.0.0.1:3000
    description: Local development
tags:
  - name: Health
    description: Service and database readiness.
  - name: Authentication
    description: Enumeration-resistant registration and access-token login.
  - name: Users
    description: Authenticated self-service profile operations.
  - name: Administration
    description: Operations requiring the current database role to be administrator.
security: []
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API and database readiness
      operationId: getHealth
      responses:
        "200":
          description: API and database are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
        "403":
          $ref: "#/components/responses/RequestBlocked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Submit a registration request
      description: A valid new email and an existing email receive the same response to reduce account enumeration.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "202":
          description: Registration request accepted without disclosing account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/RequestBlocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive an access token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credentials are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account or request is unavailable/blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/me:
    get:
      tags: [Users]
      summary: Read the current user's profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Users]
      summary: Update the current user's display name
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/users:
    get:
      tags: [Administration]
      summary: List users
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/users/{id}:
    get:
      tags: [Administration]
      summary: Read one user
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Requested user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid JSON, input, query, or route parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, expired, or unavailable authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminRequired:
      description: Current database role is not administrator
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestBlocked:
      description: Security controls blocked the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Request quota exceeded
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Database is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected internal failure with no internal details exposed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 100
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    UpdateProfileInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: "null"
    PublicUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ErrorBody"
    HealthSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, service, database]
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              const: sentinelgate-protected-app
            database:
              type: string
              const: connected
    RegistrationAccepted:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
              const: If this email can be registered, the account will be created.
    LoginSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, accessToken]
          properties:
            user:
              $ref: "#/components/schemas/PublicUser"
            accessToken:
              type: string
    UserSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/PublicUser"
    UserListSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [users, pagination]
          properties:
            users:
              type: array
              items:
                $ref: "#/components/schemas/PublicUser"
            pagination:
              type: object
              required: [page, pageSize, total]
              properties:
                page:
                  type: integer
                pageSize:
                  type: integer
                total:
                  type: integer
